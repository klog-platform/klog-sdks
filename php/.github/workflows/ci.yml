name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json
      - run: composer install --no-interaction
      - run: composer test
