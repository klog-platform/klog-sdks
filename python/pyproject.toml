[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klog-sdk"
version = "0.1.0"
description = "Cliente de ingesta REST para kLog"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "kLog" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/klog_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
