[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klog-sdk"
version = "0.1.0"
description = "Cliente de ingesta REST para kLog"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "kLog", email = "soporte@krisskira.com" }]
dependencies = []
keywords = ["klog", "telemetry", "logging", "observability", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://klog.krisskira.com/docs/sdks"
Documentation = "https://klog.krisskira.com/docs/sdks"
Repository = "https://github.com/klog-platform/klog-sdks"
"Issue Tracker" = "https://github.com/klog-platform/klog-sdks/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/klog_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
